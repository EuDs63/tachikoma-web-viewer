<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020b0d" />
    <meta name="description" content="塔奇克马 v16 交互式 3D 模型展示。" />
    <link rel="canonical" href="https://ds63.eu.org/tachikoma-web-viewer/" />
    <title>TACHIKOMA // SHELL_016</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◉</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>

    <header class="hud-top">
      <a class="identity" href="./" aria-label="Tachikoma 首页">
        <span class="identity__sigil">09</span>
        <span>TACHIKOMA <i>// SHELL_016</i></span>
      </a>
      <div class="system-state"><span></span> NETWORK ONLINE</div>
      <div class="top-links">
        <a href="assets/tachikoma-walk.glb" download>GLB ↓</a>
        <a href="https://github.com/EuDs63/tachikoma-web-viewer">SOURCE ↗</a>
      </div>
    </header>

    <main class="stage">
      <section class="intro" aria-labelledby="title">
        <p class="kicker">CYBERBRAIN / AUTONOMOUS UNIT</p>
        <h1 id="title">TACHI<br />KOMA</h1>
        <p class="summary">具备独立思考能力的多足步行战车。拖动查看，切换足部形态，播放巡逻动作。</p>
      </section>

      <div class="viewer-shell" id="viewer-shell">
        <div class="corner corner--tl" aria-hidden="true"></div>
        <div class="corner corner--tr" aria-hidden="true"></div>
        <div class="corner corner--bl" aria-hidden="true"></div>
        <div class="corner corner--br" aria-hidden="true"></div>
        <div class="target-ring" aria-hidden="true"></div>

        <div
          id="tachikoma-viewer"
          class="three-viewer"
          role="img"
          aria-label="蓝色塔奇克马三维模型。可用鼠标或触控旋转和缩放。"
        >
          <div class="load-state" id="load-state">
            <span class="load-state__ring" aria-hidden="true"></span>
            <span>SYNCING SHELL</span>
          </div>
          <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>
        </div>

        <div class="view-switcher" role="group" aria-label="观察角度">
          <button type="button" data-orbit="0deg 78deg 112%">FRONT</button>
          <button type="button" data-orbit="90deg 78deg 112%">SIDE</button>
          <button type="button" data-orbit="180deg 78deg 112%">REAR</button>
          <button type="button" data-orbit="38deg 70deg 110%">3/4</button>
        </div>

        <button class="fullscreen" id="fullscreen" type="button" aria-label="全屏查看">EXPAND ↗</button>

        <div class="control-deck">
          <div class="mode-switcher" role="group" aria-label="模型模式">
            <button class="mode is-active" type="button" data-mode="walk"><span>01</span> WALK</button>
            <button class="mode" type="button" data-mode="roll"><span>02</span> WHEEL</button>
            <button class="mode" type="button" data-mode="patrol"><span>03</span> PATROL</button>
          </div>
          <div class="transport" id="transport" hidden>
            <button id="play-toggle" type="button" aria-label="暂停动画">Ⅱ</button>
            <input id="timeline" type="range" min="0" max="1" value="0" step="0.001" aria-label="动画进度" />
            <output id="timecode" for="timeline">00:00 / 00:18</output>
          </div>
        </div>

        <p class="sr-only" id="viewer-status" aria-live="polite">步行姿态正在载入</p>
      </div>

      <aside class="telemetry" aria-label="模型参数">
        <span>UNIT</span><b>TKM-016</b>
        <span>MOTION</span><b>430 F / 24 FPS</b>
        <span>FORMAT</span><b>GLB / DRACO</b>
      </aside>

      <div class="vertical-type" aria-hidden="true">多脚思考戦車</div>
    </main>

    <footer class="hud-bottom">
      <span>INTERACTIVE MODEL ARCHIVE</span>
      <span class="coordinates">35.6762° N / 139.6503° E</span>
      <span>V16.2026</span>
    </footer>

    <noscript>请启用 JavaScript 以查看交互式 3D 模型。</noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
